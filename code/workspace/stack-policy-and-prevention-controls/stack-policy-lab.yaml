AWSTemplateFormatVersion: "2010-09-09"

Description: AWS CloudFormation workshop - Stack policy and prevention controls - stack policy (uksb-1q9p31idr) (tag:stack-policy).

# Add your code here!
# トピックの更新を拒否するスタックポリシーを設定し、スタックの削除保護を有効にします。
Parameters:
  SNSTopicTagValue:
    Description: Tag value for your Amazon SNS topic
    Type: String
    Default: Topic-Tag-1
    MinLength: 1
    MaxLength: 256

Resources:
  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: Topic-1
      Tags:
        - Key: TagSNS
          Value: !Ref SNSTopicTagValue